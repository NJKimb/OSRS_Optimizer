name: Sync OSRS Quests

on:
  schedule:
    # Runs every Wednesday at 18:00 UTC (a few hours after weekly OSRS game updates)
    - cron: '0 18 * * 3'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI anytime

permissions:
  contents: write # Needed to commit and push changes back to the repository

jobs:
  sync-quests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: API/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r API/requirements.txt

      - name: Sync quest database from OSRS Wiki
        working-directory: API
        run: |
          python -m app.scripts.sync_quests

      - name: Run verification tests
        working-directory: API
        run: |
          python -m unittest discover tests

      - name: Commit and push if quests updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if quests.json has modifications
          if git status --porcelain | grep -q "API/app/data/quests.json"; then
            echo "New or updated quest data detected. Committing changes..."
            git add API/app/data/quests.json
            git commit -m "Auto-sync quest database from OSRS Wiki [skip ci]"
            git push
          else
            echo "Quest database is already up to date. No changes to commit."
          fi
